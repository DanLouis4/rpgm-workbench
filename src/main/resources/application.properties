spring.application.name=ttrpg-manager

# Spring Boot application properties for the TTRPG Manager project

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3307/ttrpg_manager}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Hibernate ddl-auto configuration - specifies how the schema should be managed by Hibernate
# Options: validate (validate the schema) | update (update the schema) | create (create the schema) | create-drop (create and drop the schema)

spring.jpa.hibernate.ddl-auto=validate


# HikariCP connection pool configuration to manage database connections efficiently and prevent resource exhaustion
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Server forward headers strategy configuration

server.forward-headers-strategy=framework
