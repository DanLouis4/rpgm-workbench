<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

    <!-- ============================================================= -->
    <!-- Game System Record                                             -->
    <!-- ============================================================= -->

    <tr th:fragment="gameSystemRecord(system)">

        <!-- ID -->
        <td th:text="${system.gameSystemId}">
            ID
        </td>


        <!-- Name -->
        <td>

            <a th:href="@{/systems/{id}(id=${system.gameSystemId})}"
               th:text="${system.name}">
                Game System
            </a>

        </td>


        <!-- Owner -->
        <td th:text="${system.owner != null
                        ? system.owner.username
                        : 'Unknown'}">
            Owner
        </td>


        <!-- Visibility -->
        <td>

            <span th:if="${system.public}"
                  class="badge text-bg-success">
                Public
            </span>

            <span th:unless="${system.public}"
                  class="badge text-bg-secondary">
                Private
            </span>

        </td>


        <!-- Flag Status -->
        <td>

            <span th:if="${system.flagged}"
                  class="badge text-bg-warning">
                Flagged
            </span>

            <span th:unless="${system.flagged}"
                  class="badge text-bg-light">
                Clear
            </span>

        </td>


        <!-- Last Updated -->
        <td th:text="${system.updatedAt != null
                        ? #temporals.format(
                            system.updatedAt,
                            'MMM dd, yyyy')
                        : '-'}">
            Jan 01, 2026
        </td>


        <!-- ========================================================= -->
        <!-- Actions                                                    -->
        <!-- ========================================================= -->

        <td class="text-nowrap">

            <!-- View
                 Actual visibility is enforced by the service/controller.
                 If the record reaches this fragment, the current user is
                 assumed to have permission to view it. -->
            <a class="btn btn-sm btn-outline-primary"
               th:href="@{/systems/{id}(id=${system.gameSystemId})}">

                <i class="bi bi-eye"></i>
                View

            </a>


            <!-- ----------------------------------------------------- -->
            <!-- Game Designer Ownership Actions                       -->
            <!-- ----------------------------------------------------- -->

            <th:block sec:authorize="hasRole('GAME_DESIGNER')">

                <!-- Only the owning Game Designer receives edit/delete
                     controls. These checks are only UI restrictions;
                     backend authorization must independently enforce them. -->

                <th:block th:if="${system.owner != null
                                  and system.owner.username
                                      == #authentication.name}">

                    <a class="btn btn-sm btn-outline-success"
                       th:href="@{/systems/{id}/edit(
                            id=${system.gameSystemId})}">

                        <i class="bi bi-pencil-square"></i>
                        Edit

                    </a>

                    <form th:action="@{/systems/{id}/delete(id=${system.gameSystemId})}"
                        method="post"
                        class="d-inline"
                        onsubmit="return confirm('Are you sure you want to delete this Game System? This action cannot be undone.');">

                        <button type="submit"
                                class="btn btn-sm btn-outline-danger"
                                title="Delete Game System">
                            <i class="bi bi-trash"></i>Delete
                            <span class="visually-hidden">Delete Game System</span>
                        </button>

                    </form>

                </th:block>

            </th:block>


            <!-- ----------------------------------------------------- -->
            <!-- Administrator Moderation                              -->
            <!-- ----------------------------------------------------- -->

            <span sec:authorize="hasRole('ADMINISTRATOR')">

                <a class="btn btn-sm btn-outline-warning"
                   th:href="@{/admin/systems/{id}(
                        id=${system.gameSystemId})}">

                    <i class="bi bi-shield-exclamation"></i>
                    Review

                </a>

            </span>

        </td>

    </tr>

</body>
</html>
