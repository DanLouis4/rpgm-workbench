<!DOCTYPE html>
<html lang="en"
    xmlns:th="http://www.thymeleaf.org">

<body>

    <!-- ============================================================= -->
    <!-- Campaign List                                                  -->
    <!-- ============================================================= -->

    <div th:fragment="campaignList(campaigns)"
         class="table-responsive">

        <table class="table table-striped table-hover align-middle">

            <thead class="table-dark">

                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Name</th>
                    <th scope="col">Game System</th>
                    <th scope="col">Owner</th>
                    <th scope="col">Visibility</th>
                    <th scope="col">Status</th>
                    <th scope="col">Updated</th>
                    <th scope="col">Actions</th>
                </tr>

            </thead>

            <tbody>

                <!-- ================================================= -->
                <!-- Campaign Records                                  -->
                <!-- ================================================= -->

                <th:block th:if="${campaigns != null
                                  and !#lists.isEmpty(campaigns)}">

                    <tr th:each="campaign : ${campaigns}"
                        th:replace="
                            ~{fragments/campaign/record
                            :: campaignRecord(${campaign})}">
                    </tr>

                </th:block>


                <!-- ================================================= -->
                <!-- Empty State                                       -->
                <!-- ================================================= -->

                <tr th:if="${campaigns == null
                            or #lists.isEmpty(campaigns)}">

                    <td colspan="8"
                        class="text-center text-muted py-4">

                        <i class="bi bi-map fs-3"></i>

                        <p class="mb-0 mt-2">
                            No campaigns to display.
                        </p>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</body>
</html>
