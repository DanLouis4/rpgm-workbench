<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/defaultTemplate}">

<head>
    <title>Login</title>
</head>

<body>

    <section layout:fragment="content">

        <div class="container py-5">

            <div class="row justify-content-center">

                <div class="col-12 col-md-8 col-lg-5">

                    <div class="card shadow-sm">

                        <div class="card-body p-4">

                            <div class="text-center mb-4">

                                <i class="bi bi-box-arrow-in-right fs-1"></i>

                                <h1 class="h3 mt-2">
                                    Sign In
                                </h1>

                                <p class="text-muted mb-0">
                                    Sign in to access your RPGM Workbench profile.
                                </p>

                            </div>


                            <!-- Login Status Message -->
                            <div th:if="${loginStatus}"
                                 class="alert"
                                 th:classappend="${loginStatus.alertClass}"
                                 role="alert"
                                 th:text="${loginStatus.message}">
                                Login status message
                            </div>


                            <!-- Login Form -->
                            <form th:action="@{/login}"
                                  method="post">

                                <!-- Username -->
                                <div class="mb-3">

                                    <label for="username"
                                           class="form-label">
                                        Username
                                    </label>

                                    <input type="text"
                                           id="username"
                                           name="username"
                                           class="form-control"
                                           autocomplete="username"
                                           required
                                           autofocus>

                                </div>


                                <!-- Password -->
                                <div class="mb-3">

                                    <label for="password"
                                           class="form-label">
                                        Password
                                    </label>

                                    <input type="password"
                                           id="password"
                                           name="password"
                                           class="form-control"
                                           autocomplete="current-password"
                                           required>

                                </div>


                                <!-- Submit -->
                                <div class="d-grid">

                                    <button type="submit"
                                            class="btn btn-primary">

                                        <i class="bi bi-box-arrow-in-right"></i>
                                        Sign In

                                    </button>

                                </div>

                            </form>


                            <hr class="my-4">


                            <!-- Registration Link -->
                            <p class="text-center mb-0">

                                Don't have an account?

                                <a th:href="@{/register}">
                                    Create one
                                </a>

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

</body>
</html>
