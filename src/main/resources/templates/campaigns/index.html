<!DOCTYPE html>
<html lang="en"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    layout:decorate="~{layouts/defaultTemplate}">

<head>
    <title>Campaigns</title>
</head>

<body>

    <section class="rpgm-index-page"
            layout:fragment="content">

        <!-- ========================================================= -->
        <!-- Full-Width Header                                         -->
        <!-- ========================================================= -->

        <section class="rpgm-gallery-hero">

            <div class="container py-5">

                <div class="d-flex flex-column flex-lg-row
                            justify-content-between
                            align-items-lg-center
                            gap-4">

                    <div>

                        <h1 class="display-6 mb-2">
                            Campaigns
                        </h1>

                        <p class="lead mb-0">
                            Browse new tabletop RPG campaigns to explore and discover; uncover new settings and adventures, and craft a story your players can make their own..
                        </p>
                    </div>
                    <div sec:authorize="
                        hasAnyRole('GAME_MASTER', 'GAME_DESIGNER', 'ADMINISTRATOR')">

                        <a class="btn rpgm-btn-gold"
                        th:href="@{/campaigns/create}">

                            <i class="bi bi-plus-circle me-1"></i>
                            Add a Campaign

                        </a>

                    </div>

                </div>

            </div>

        </section>

        <!-- ========================================================= -->
        <!-- Gallery Content                                           -->
        <!-- ========================================================= -->

        <section class="rpgm-gallery-content">

            <!-- Page Feedback -->
            <div th:if="${deletedCampaignName != null}"
                class="alert alert-warning"
                role="alert">

                <i class="bi bi-check-circle me-2"></i>

                Campaign:
                "<strong th:text="${deletedCampaignName}">
                    Campaign Name
                </strong>"
                deleted successfully.

            </div>


        <!-- ========================================================= -->
        <!-- Browse / Search Controls                                  -->
        <!-- ========================================================= -->

        <section class="rpgm-browse-toolbar mb-4">

            <div class="row g-3 align-items-end">

                <!-- Search Field -->
                <div class="col-12 col-lg">

                    <label for="campaignSearch"
                        class="form-label rpgm-browse-label">
                        Search Campaigns
                    </label>

                    <div class="input-group">

                        <span class="input-group-text rpgm-search-icon">
                            <i class="bi bi-search"></i>
                        </span>

                        <input id="campaignSearch"
                            type="search"
                            class="form-control rpgm-search-input"
                            placeholder="Search by name..."
                            disabled>

                    </div>

                </div>


                <!-- Search Action -->
                <div class="col-12 col-lg-auto d-grid">

                    <button class="btn rpgm-btn-gold rpgm-search-button"
                            type="button"
                            disabled>

                        <i class="bi bi-search me-1"></i>
                        Search

                    </button>

                </div>

            </div>

        </section>


    <!-- ========================================================= -->
    <!-- Gallery Records                                           -->
    <!-- ========================================================= -->

    <div class="container pb-5">
    <!-- Include Campaign Grid
       
        <div th:replace=
            "~{fragments/campaign/grid :: campaignGrid(${campaigns})}">
        </div>

    -->
    </div>

    </section>

</body>
</html>
