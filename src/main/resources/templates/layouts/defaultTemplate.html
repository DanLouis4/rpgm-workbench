<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE">
        RPGM Workbench
    </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com"
        rel="stylesheet">
    <link href="https://fonts.gstatic.com" crossorigin
        rel="preconnect">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Rye&display=swap"
        rel="stylesheet">

    <!-- Application CSS -->
    <link th:href="@{/css/custom-navbar.css}"
        rel="stylesheet">

    <link th:href="@{/css/custom-forms.css}"
        rel="stylesheet">

    <link th:href="@{/css/custom-main.css}"
        rel="stylesheet">

</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Shared application header / navigation -->
    <div th:replace="~{layouts/header :: header}"></div>

    <!-- Page-specific content -->
    <main class="container-fluid mt-5 p-0">

        <div layout:fragment="content">
            Page Content
        </div>

    </main>

    <!-- Shared application footer -->
    <div th:replace="~{layouts/footer :: footer}"></div>

    <!-- Bootstrap JavaScript Bundle -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Page-specific JavaScript -->
    <th:block layout:fragment="scripts">
    </th:block>

</body>
</html>
