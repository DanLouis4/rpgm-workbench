<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layouts/defaultTemplate}">

<head>
    <title>Characters</title>
</head>


<body>

    <section class="rpgm-index-page"
            layout:fragment="content">

        <!-- ========================================================= -->
        <!-- Full-Width Header                                         -->
        <!-- ========================================================= -->

        <section class="rpgm-gallery-hero">

            <div class="container py-5">

                <div class="d-flex flex-column flex-lg-row
                            justify-content-between
                            align-items-lg-center
                            gap-4">

                    <div>

                        <h1 class="display-6 mb-2">
                            Characters
                        </h1>

                        <p class="lead mb-0">
                            Discover characters created across different game systems and campaigns, or create one of your own and begin building their story.

                            <span sec:authorize="isAnonymous()">
                               Or <a class="rpgm-link" th:href="@{/register}">sign up</a> to create and configure your own.
                            </span>
                        </p>
                    </div>

                    <div sec:authorize="isAuthenticated()">

                        <a class="btn rpgm-btn-gold"
                        th:href="@{/characters/create}">

                            <i class="bi bi-plus-circle me-1"></i>
                            Add a Character

                        </a>

                    </div>

                </div>

            </div>

        </section>

        <!-- ========================================================= -->
        <!-- Gallery Content                                           -->
        <!-- ========================================================= -->

        <section class="rpgm-gallery-content">

            <!-- Page Feedback -->
            <div th:if="${deletedCharacterName != null}"
                class="alert alert-warning"
                role="alert">

                <i class="bi bi-check-circle me-2"></i>

                Character:
                "<strong th:text="${deletedCharacterName}">
                    Character Name
                </strong>"
                deleted successfully.

            </div>


        <!-- ========================================================= -->
        <!-- Browse / Search Controls                                  -->
        <!-- ========================================================= -->

        <section class="rpgm-browse-toolbar mb-4">

            <div class="row g-3 align-items-end">

                <!-- Search Field -->
                <div class="col-12 col-lg">

                    <label for="characterSearch"
                        class="form-label rpgm-browse-label">
                        Search Characters
                    </label>

                    <div class="input-group">

                        <span class="input-group-text rpgm-search-icon">
                            <i class="bi bi-search"></i>
                        </span>

                        <input id="characterSearch"
                            type="search"
                            class="form-control rpgm-search-input"
                            placeholder="Search by name..."
                            disabled>

                    </div>

                </div>


                <!-- Search Action -->
                <div class="col-12 col-lg-auto d-grid">

                    <button class="btn rpgm-btn-gold rpgm-search-button"
                            type="button"
                            disabled>

                        <i class="bi bi-search me-1"></i>
                        Search

                    </button>

                </div>

            </div>

        </section>


    <!-- ========================================================= -->
    <!-- Gallery Records                                           -->
    <!-- ========================================================= -->

    <div class="container pb-5">
    <!-- Include Character Grid
       
        <div th:replace=
            "~{fragments/character/grid :: characterGrid(${characters})}">
        </div>

    -->
    </div>

    </section>

</body>
</html>
